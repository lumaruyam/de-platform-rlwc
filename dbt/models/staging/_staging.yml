version: 2

# meta.classification: public | internal | confidential (docs/data-classification.md)
# meta.pii: none | indirect | direct

models:
  - name: stg_orders
    description: "One row per order, duplicates removed."
    meta: {classification: confidential}
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: buyer_id
        meta: {pii: indirect}
      - name: payment_id
        meta: {pii: indirect}

  - name: stg_order_items
    description: "One row per product per order."
    meta: {classification: internal}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, p_id]
    columns:
      - name: qty
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: stg_review
    description: "One row per review. E-mails and phone numbers masked, author dropped."
    meta: {classification: internal}
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: rating
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_text
        description: "Free text written by the customer, with [email] and [phone] masks."
        meta: {pii: none}

  - name: stg_product
    meta: {classification: public}
    columns:
      - name: p_id
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('category')
                field: category_id

  - name: stg_customer_address
    description: "Customer addresses reduced to the country."
    meta: {classification: confidential}
    columns:
      - name: c_id
        meta: {pii: indirect}
      - name: country
        meta: {pii: none}
