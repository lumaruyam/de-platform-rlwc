version: 2

models:
  - name: stg_orders
    description: "One row per order, duplicates removed."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_order_items
    description: "One row per product per order."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, p_id]
    columns:
      - name: qty
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
  - name: stg_review
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: rating
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
  - name: stg_product
    columns:
      - name: p_id
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('category')
                field: category_id
  - name: stg_customer_address
    description: "Customer addresses reduced to the country."
